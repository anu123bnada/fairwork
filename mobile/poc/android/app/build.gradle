apply plugin: 'com.android.application'

// server.url to localhost is a development transport, never a release architecture.
// The release variant stays disabled unless the owner supplies, as build parameters,
// a production application ID and an https origin:
//   gradlew assembleRelease -PoryqenReleaseAppId=<id> -PoryqenReleaseOrigin=https://<host>
// The development ID (org.fairwork.*) and any non-https origin are always refused.
// Signing material is never stored in the repository: see docs/ORYQEN_RELEASE_SIGNING.md.
def oryqenReleaseAppId = (project.findProperty("oryqenReleaseAppId") ?: "").toString().trim()
def oryqenReleaseOrigin = (project.findProperty("oryqenReleaseOrigin") ?: "").toString().trim().replaceAll('/+$', '')
def oryqenVersionCode = ((project.findProperty("oryqenVersionCode") ?: "1").toString()) as int
def oryqenVersionName = (project.findProperty("oryqenVersionName") ?: "1.0.0").toString()
def releaseConfigured = oryqenReleaseAppId ==~ /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/ &&
        !oryqenReleaseAppId.startsWith("org.fairwork.") &&
        oryqenReleaseOrigin ==~ /^https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?$/
logger.lifecycle("ORYQEN release variant: " + (releaseConfigured ? "enabled for " + oryqenReleaseAppId + " -> " + oryqenReleaseOrigin : "disabled (appId='" + oryqenReleaseAppId + "', origin='" + oryqenReleaseOrigin + "')"))
androidComponents {
    beforeVariants(selector().withBuildType("release")) { variantBuilder ->
        variantBuilder.enable = releaseConfigured
    }
    onVariants(selector().withBuildType("release")) { variant ->
        variant.applicationId.set(oryqenReleaseAppId)
    }
}

android {
    namespace = "org.fairwork.localpoc"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.fairwork.localpoc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode oryqenVersionCode
        versionName oryqenVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        online {
            initWith debug
            applicationIdSuffix ".online"
            versionNameSuffix "-online-preview"
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            versionNameSuffix ""
            def keystorePath = System.getenv("ORYQEN_ANDROID_KEYSTORE_PATH")
            if (keystorePath && file(keystorePath).exists()) {
                signingConfig signingConfigs.create("oryqenRelease") {
                    storeFile file(keystorePath)
                    storePassword System.getenv("ORYQEN_ANDROID_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("ORYQEN_ANDROID_KEY_ALIAS")
                    keyPassword System.getenv("ORYQEN_ANDROID_KEY_PASSWORD")
                }
            }
        }
    }
}

// Release configuration is generated from the parameters above so the committed
// project never contains a production origin or identifier by accident.
tasks.register("oryqenReleaseConfig") {
    def target = file("src/release/assets/capacitor.config.json")
    inputs.property("appId", oryqenReleaseAppId)
    inputs.property("origin", oryqenReleaseOrigin)
    outputs.file(target)
    doLast {
        if (!releaseConfigured) throw new GradleException("Release needs -PoryqenReleaseAppId and an https -PoryqenReleaseOrigin")
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            appId: oryqenReleaseAppId, appName: "ORYQEN", webDir: "www",
            server: [url: oryqenReleaseOrigin + "/sign-in", cleartext: false, errorPath: "offline.html"],
            android: [allowMixedContent: false],
            plugins: [SystemBars: [insetsHandling: "native"], CapacitorHttp: [enabled: false], CapacitorCookies: [enabled: false]]
        ]))
    }
}
// The online (testing) variant connects to an origin supplied at build time, never one committed to the source:
//   gradlew assembleOnline -PoryqenOnlineOrigin=https://oryqen-staging.vercel.app
// Its capacitor config is generated into src/online (git-ignored), so the installed app's backend is visible in the build log and cannot drift from the source.
def oryqenOnlineOrigin = (project.findProperty("oryqenOnlineOrigin") ?: "").toString().trim().replaceAll('/+$', '')
def onlineConfigured = oryqenOnlineOrigin ==~ /^https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?$/
logger.lifecycle("ORYQEN online variant: " + (onlineConfigured ? "connects to " + oryqenOnlineOrigin : "origin not set (assembleOnline will refuse)"))
tasks.register("oryqenOnlineConfig") {
    def target = file("src/online/assets/capacitor.config.json")
    inputs.property("origin", oryqenOnlineOrigin)
    outputs.file(target)
    doLast {
        if (!onlineConfigured) throw new GradleException("The online build needs -PoryqenOnlineOrigin=https://<host> (https only, no path)")
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            appId: "org.fairwork.localpoc.online", appName: "ORYQEN Online Preview", webDir: "www",
            server: [url: oryqenOnlineOrigin + "/sign-in", cleartext: false, errorPath: "offline.html"],
            android: [allowMixedContent: false],
            plugins: [SystemBars: [insetsHandling: "native"], CapacitorHttp: [enabled: false], CapacitorCookies: [enabled: false]]
        ]))
    }
}
tasks.configureEach { task ->
    if (task.name != "oryqenOnlineConfig" && task.name ==~ /.*Online.*/ && !task.name.startsWith("oryqen")) task.dependsOn("oryqenOnlineConfig")
}
tasks.configureEach { task ->
    if (task.name != "oryqenReleaseConfig" && task.name.contains("Release")) task.dependsOn("oryqenReleaseConfig")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
