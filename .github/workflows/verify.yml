name: Local verification
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      APP_ORIGIN: http://localhost:3000
      FAIRWORK_DATA_MODE: synthetic
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-local-ocr.mjs
      - run: node scripts/prepare-release-candidate.mjs
      - run: node scripts/check-brand-assets.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/verify-android-poc.mjs
      - name: Install isolated PostgreSQL test tools
        run: npm install --prefix test-results/day4-postgres-tools --no-audit --no-fund @embedded-postgres/windows-x64@18.4.0-beta.17 pg@8.23.1
      - run: node scripts/test-day4-postgres.mjs
      - run: node scripts/test-day5-postgres.mjs
      - run: node scripts/test-day6-postgres.mjs
      - run: node scripts/test-day7-postgres.mjs
      - run: npx playwright install chromium
      - run: npm run test:e2e:isolated
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          retention-days: 7
          path: |
            test-results/*/tests.log
            test-results/day2-browser*.log
            test-results/oryqen-visual/*.png
            playwright-report/
